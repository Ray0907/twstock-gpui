[package]
name = "twstock-gpui"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
encoding_rs = "0.8"
html5ever = "0.27"
chrono = "0.4"
futures = "0.3"
tempfile = "3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
gpui-kit = { version = "0.7.3", features = ["test-support"] }

[[test]]
name = "live_shot"
harness = false

[[test]]
name = "rendering"
harness = false
test = false
