[package]
name = "twstock-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = "0.4"
futures = "0.3"
tempfile = "3"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
gpui-kit = { version = "0.7.3", features = ["test-support"] }

[[test]]
name = "live_shot"
harness = false

[[test]]
name = "rendering"
harness = false
test = false
